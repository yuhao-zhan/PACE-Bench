name: smoke

on: [push, pull_request]

permissions:
  contents: read

jobs:
  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src
      - run: pace-bench --help
      - run: pace-bench validate --task all --contracts-only
      - run: pace-bench evaluate --task all --env all --provider mock --model mock --dry-run
      - run: >-
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          pace-bench evaluate --task S_01 --env Stage-1
          --method vanilla --provider mock --model mock
          --attempts 1 --output /tmp/pace-bench-smoke --no-resume
