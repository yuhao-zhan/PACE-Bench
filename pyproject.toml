[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pace-bench"
version = "0.1.0"
description = "Physics Adaptation via Code Evolution in Dynamic Environments"
requires-python = ">=3.10"

[project.scripts]
pace-bench = "pace_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["custom_extension"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["pace_bench*"]

[tool.setuptools.package-data]
"pace_bench.evaluation" = ["prompt_data/*.md"]
"pace_bench.tasks.categories" = ["primitives_api.json"]
