[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pace-bench"
version = "0.2.0"
description = "Physics Adaptation via Code Evolution in Dynamic Environments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "Box2D>=2.3.10,<2.4",
    "Pillow>=10,<12",
    "pygame>=2.5,<3",
    "openai>=1.40,<3",
    "accelerate>=1.0,<2",
    "safetensors>=0.4,<1",
    "torch>=2.2,<3",
    "transformers>=4.45,<5",
]

[project.scripts]
pace-bench = "pace_bench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["custom_extension"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["pace_bench*"]

[tool.setuptools.package-data]
"pace_bench.evaluation" = ["prompt_data/*.md"]
"pace_bench.tasks.categories" = ["primitives_api.json"]
